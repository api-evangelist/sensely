api: sensely-platform-api
note: >-
  Sensely publishes no OpenAPI and no public authentication reference — the SDK READMEs say full
  documentation is released only to partners under an executed Partner Agreement. Everything below was
  observed directly: either in the JavaScript Sensely itself serves to every visitor of its demo, or
  by fetching the identity provider's own discovery document. No credential value is recorded here.
schemes:
- name: partnerCredentials
  type: http
  scheme: custom
  in: body
  endpoint: 'POST https://apis.sensely.com/authenticate/authenticate'
  request_fields: [username, password, qa]
  description: >-
    Primary partner authentication. The SDK posts a partner username and password and receives a
    token, a refresh token and an id token. The same username/password pair is passed to the iOS
    SDK's SenselyWidget.initialize alongside a procedureId.
  observed_status: '200 (GET to the same path returned HTTP 200, application/json, 740 bytes, 2026-08-26)'
- name: refreshToken
  type: http
  scheme: bearer
  endpoint: 'POST https://apis.sensely.com/authenticate/refresh'
  request_fields: [refresh_token, region, qa]
  description: >-
    Exchanges a refresh token for a new access token. The SDK sends region (observed value "UK") when
    operating against a non-default regional deployment.
- name: apiKey
  type: apiKey
  in: header
  name: x-api-key
  description: >-
    AWS API Gateway key required on the unauthenticated /pub/* endpoints (reset-password,
    verify-program-code). A key value is embedded in the publicly served Web SDK bundle, so it is a
    publishable client key rather than a secret; the value is deliberately not recorded in this
    artifact. Any request to apis.sensely.com without it returns HTTP 403 with
    x-amzn-errortype ForbiddenException.

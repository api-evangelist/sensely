note: >-
  Sensely ships three first-party conversational SDKs (iOS, Android, Web). None of them is published
  to a mainstream language registry. The iOS SDK is distributed as a Swift Package whose binary
  targets are pulled from Sensely's own Nexus repository at nexus.sense.ly; the Android SDK is a
  source repository with a single "SDK" tag and no Maven coordinates; the Web SDK is a CDN-hosted UMD
  bundle at an unpinned "latest" path. All three READMEs state that full documentation is released
  only on request, and the SDK licence requires an executed Partner Agreement.

note: >-
  Sensely publishes a status page and versions its SDKs with semver, but publishes no API versioning
  policy, no deprecation policy, no Sunset/Deprecation header commitment and no SLA. The most
  material lifecycle fact about this provider is corporate rather than technical: Sensely was
  acquired by Mediktor in June 2024, and its public engineering surface has been broadly static since
  — the last SDK tag is November 2024, the Android repository has not been pushed since March 2024,
  and the Web SDK repository has not been pushed since July 2020.

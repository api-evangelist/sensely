aid: sensely
name: Sensely
description: >-
  Sensely is a San Francisco conversational-AI company whose empathy-driven avatar assistant guides
  health-plan members and patients through symptom assessment, care navigation, mental-health
  check-ins, enrollment and onboarding, and chronic-condition management. The platform is licensed to
  payers, providers, pharmaceutical companies and employers, and is embedded by partners through
  first-party iOS, Android and Web/JavaScript conversational SDKs backed by an AWS-hosted platform API
  at apis.sensely.com. Clinical content is licensed from Mayo Clinic and the NHS, and the assistant is
  deployed across the Sensely app, web, SMS, WhatsApp, Facebook Messenger, WeChat, Line and Telegram.
  Sensely was acquired by Spanish AI-triage company Mediktor, announced 5 June 2024.

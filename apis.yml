apis:
- aid: sensely-platform-api
  name: Sensely Platform API
  description: >-
    The AWS API Gateway surface behind the Sensely conversational SDKs. Observed public operations
    cover partner authentication and token refresh, member self-service password reset, program-code
    verification and avatar audio generation. Sensely publishes no OpenAPI or public API reference;
    full SDK and API documentation is released only to partners with an executed Partner Agreement,
    so the operation set recorded here was read from Sensely's own publicly served Web SDK bundle.

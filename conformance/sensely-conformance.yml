- id: hipaa
  name: 'HIPAA (US Health Insurance Portability and Accountability Act)'
  conforms: unknown
  evidence: >-
    Sensely's Terms of Use reference HIPAA and a Business Associate Agreement, but make no affirmative
    compliance claim and name no audit or attestation. The BAA is referenced by an unfilled template
    placeholder. No SOC 2, ISO 27001, HITRUST or NHS DSPT claim appears anywhere on sensely.com.
  source: https://sensely.com/terms-of-use/
- id: gdpr
  name: 'GDPR / UK GDPR'
  conforms: unknown
  evidence: >-
    Sensely maintains a UK-facing privacy centre (https://sensely.com/privacy-centre/, HTTP 200) with
    an NHS transparency notice, which is consistent with a UK GDPR posture, but publishes no DPA, no
    sub-processor list and no data-protection contact.
  source: https://sensely.com/privacy-centre/

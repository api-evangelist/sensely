generated: '2026-08-26'
method: probed
source: >-
  Live fetch of the Cognito OIDC discovery document
  (https://cognito-idp.us-west-1.amazonaws.com/us-west-1_pMO3JfnoS/.well-known/openid-configuration,
  HTTP 200, 2026-08-26); TLS/DNS probes of sensely.com and apis.sensely.com; and a read of
  https://sensely.com/terms-of-use/ and https://sensely.com/privacy-policy/ for compliance claims.
note: >-
  Sensely operates in a regulated market — US health plans and providers under HIPAA, and NHS England
  through the AskFirst deployment — but publishes no certifications, no trust centre and no
  compliance page. Its Terms of Use place HIPAA responsibility on the clinician using the service and
  refer to a Business Associate Agreement whose name is still an unfilled template placeholder
  ("a [insert name of agreement] with Sensely"). Nothing here is asserted that Sensely does not
  demonstrably do, and no Compliance pointer is emitted, because no certification is published.
standards:
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    Sensely's Amazon Cognito user pool serves a valid OIDC discovery document at
    cognito-idp.us-west-1.amazonaws.com/us-west-1_pMO3JfnoS/.well-known/openid-configuration
    (HTTP 200), advertising issuer, authorization, token, userinfo, revocation, end_session and
    jwks_uri endpoints with RS256 id token signing.
  caveat: >-
    The discovery document is served by AWS on Sensely's behalf, not from a Sensely-controlled host.
    No /.well-known/openid-configuration exists on sensely.com or apis.sensely.com.
- id: oauth2
  name: OAuth 2.0
  conforms: partial
  evidence: >-
    The Cognito pool exposes standard OAuth 2.0 authorization, token and revocation endpoints with
    response_types code and token. However, the partner-facing platform API at apis.sensely.com does
    not use OAuth: it takes a username and password in a JSON body at /authenticate/authenticate and
    returns an opaque token pair, and its public endpoints are gated by a static AWS API Gateway
    x-api-key.
- id: rfc9457
  name: 'RFC 9457 Problem Details for HTTP APIs'
  conforms: false
  evidence: >-
    apis.sensely.com returns the stock AWS API Gateway envelope — content-type application/json with
    a bare {"message": ...} body and the error type in an x-amzn-errortype header — not
    application/problem+json. Observed on six paths, 2026-08-26.
- id: rfc8594
  name: 'RFC 8594 Sunset HTTP Header'
  conforms: false
  evidence: 'No Sunset or Deprecation header observed and no deprecation policy published.'
- id: idempotency
  name: Idempotency keys
  conforms: false
  evidence: >-
    No idempotency header is sent by any Sensely SDK or documented anywhere, while the Web SDK
